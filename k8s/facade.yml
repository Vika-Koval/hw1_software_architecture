apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-deployment
  namespace: micro-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facade-service
  template:
    metadata:
      labels:
        app: facade-service
    spec:
      containers:
        - name: facade-service
          image: facade-image:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: microservices-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: facade-service
  namespace: micro-lab
spec:
  type: NodePort 
  selector:
    app: facade-service
  ports:
    - protocol: TCP
      port: 8080        
      targetPort: 8000    
      nodePort: 30080     